security:
    providers:
        users:
            entity:
                class: App\Entity\User
                property: id

    firewalls:
        dev:
            pattern: ^/(_profiler(/|$)|(_wdt|assets|build)/)
            security: false
        api:
            pattern: ^/api
            stateless: true
            provider: users
            access_token:
                token_handler: App\Security\UserTokenHandler

    access_control:
        - { path: ^/api/user$, methods: [POST], roles: PUBLIC_ACCESS }
        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }
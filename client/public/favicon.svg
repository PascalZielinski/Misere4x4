<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Misère 4x4</title>
  <!-- Rahmen / Gitterlinien -->
  <rect width="64" height="64" rx="9" fill="#d9a27a"/>

  <!-- 4x4 Felder -->
  <g fill="#1c1916">
    <rect x="3"  y="3"  width="13" height="13" rx="2"/>
    <rect x="18" y="3"  width="13" height="13" rx="2"/>
    <rect x="33" y="3"  width="13" height="13" rx="2"/>
    <rect x="48" y="3"  width="13" height="13" rx="2"/>

    <rect x="3"  y="18" width="13" height="13" rx="2"/>
    <rect x="18" y="18" width="13" height="13" rx="2"/>
    <rect x="33" y="18" width="13" height="13" rx="2"/>
    <rect x="48" y="18" width="13" height="13" rx="2"/>

    <rect x="3"  y="33" width="13" height="13" rx="2"/>
    <rect x="18" y="33" width="13" height="13" rx="2"/>
    <rect x="33" y="33" width="13" height="13" rx="2"/>
    <rect x="48" y="33" width="13" height="13" rx="2"/>

    <rect x="3"  y="48" width="13" height="13" rx="2"/>
    <rect x="18" y="48" width="13" height="13" rx="2"/>
    <rect x="33" y="48" width="13" height="13" rx="2"/>
    <rect x="48" y="48" width="13" height="13" rx="2"/>
  </g>

  <!-- 3x X auf der Diagonalen -->
  <g stroke="#d9a27a" stroke-width="2.8" stroke-linecap="round">
    <path d="M50.7 5.7l7.6 7.6M58.3 5.7l-7.6 7.6"/>
    <path d="M35.7 20.7l7.6 7.6M43.3 20.7l-7.6 7.6"/>
    <path d="M20.7 35.7l7.6 7.6M28.3 35.7l-7.6 7.6"/>
  </g>

  <!-- 2x O in freien Feldern -->
  <g fill="none" stroke="#efe6d6" stroke-width="2.8">
    <circle cx="9.5"  cy="24.5" r="3.9"/>
    <circle cx="39.5" cy="54.5" r="3.9"/>
  </g>

  <!-- Durchgestrichene Linie -->
  <line x1="59.5" y1="4.5" x2="19.5" y2="44.5" stroke="#e5484d" stroke-width="3.6" stroke-linecap="round"/>
</svg>

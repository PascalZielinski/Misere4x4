services:
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    volumes:
      - ./client:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8080
      VITE_SERVER: ${VITE_SERVER:-http://192.168.178.66:8080}
      VITE_MERCURE_URL: ${MERCURE_PUBLIC_URL:-http://192.168.178.66:3000/.well-known/mercure}

  db:
    image: mariadb:10.4.32
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: misere
      MYSQL_USER: symfony
      MYSQL_PASSWORD: symfony
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql

  server:
    build: ./server
    working_dir: /var/www/html
    command:
      - sh
      - -c
      - >-
        chmod -R g+rwX public/uploads &&
        find public/uploads -type d -exec chmod g+s {} + &&
        exec apache2-foreground
    volumes:
      - ./server:/var/www/html
      - ./php-uploads.ini:/usr/local/etc/php/conf.d/uploads.ini
    ports:
      - "8080:80"
    environment:
      MERCURE_URL: http://mercure/.well-known/mercure
      MERCURE_PUBLIC_URL: ${MERCURE_PUBLIC_URL:-http://192.168.178.66:3000/.well-known/mercure}
      MERCURE_JWT_SECRET: "${MERCURE_JWT_SECRET:-!ChangeThisMercureHubJWTSecretKey!}"
      MERCURE_JWT_ISSUER: ${MERCURE_JWT_ISSUER:-https://localhost}
      API_CORS_ORIGINS: ${API_CORS_ORIGINS:-http://192.168.178.66:5173}
    depends_on:
      - db
      - mercure

  mercure:
    image: dunglas/mercure
    restart: unless-stopped
    environment:
      SERVER_NAME: ":80"
      MERCURE_PUBLISHER_JWT_KEY: "${MERCURE_JWT_SECRET:-!ChangeThisMercureHubJWTSecretKey!}"
      MERCURE_SUBSCRIBER_JWT_KEY: "${MERCURE_JWT_SECRET:-!ChangeThisMercureHubJWTSecretKey!}"
      MERCURE_CORS_ORIGINS: ${MERCURE_CORS_ORIGINS:-http://192.168.178.66:5173}
      MERCURE_EXTRA_DIRECTIVES: |
        cors_origins ${MERCURE_CORS_ORIGINS:-http://192.168.178.66:5173}
    command: /usr/bin/caddy run --config /etc/caddy/Caddyfile
    ports:
      - "3000:80"
    volumes:
      - mercure_data:/data
      - mercure_config:/config

  phpmyadmin:
    image: arm64v8/phpmyadmin
    restart: always
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: root
      UPLOAD_LIMIT: 256M
    depends_on:
      - db

volumes:
  db_data:
  mercure_data:
  mercure_config: